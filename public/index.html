<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Leones - Trading Dashboard</title>
  <style>
    :root{
      --bg:#0b0b0b; --panel:#0f1720; --muted:#9aa4b2; --accent:#f59e0b;
      --glass: rgba(255,255,255,0.03);
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:var(--bg);color:#e6eef6;}
    .app {display:flex;height:100vh;gap:12px;padding:12px;box-sizing:border-box;}
    .sidebar{width:320px;background:var(--panel);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}
    .search{display:flex;gap:8px}
    .search input{flex:1;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    .market-tabs{display:flex;gap:8px;flex-wrap:wrap}
    .market-tab{padding:6px 8px;border-radius:6px;background:var(--glass);cursor:pointer;font-size:13px}
    .market-tab.active{background:linear-gradient(90deg,#111827,#0b1220);box-shadow:0 4px 14px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.02)}
    .symbols{display:flex;flex-direction:column;gap:6px}
    .symbol-row{display:flex;justify-content:space-between;gap:8px;padding:8px;border-radius:6px;cursor:pointer}
    .symbol-row:hover{background:rgba(255,255,255,0.02)}
    .symbol-left{display:flex;gap:8px;align-items:center}
    .symbol-name{font-weight:600}
    .symbol-label{font-size:12px;color:var(--muted)}
    .symbol-price{font-weight:700}
    .main{flex:1;display:flex;flex-direction:column;gap:12px}
    .chart-wrap{flex:1;background:linear-gradient(180deg,#071019,#071420);border-radius:8px;padding:12px;display:flex;flex-direction:column}
    .chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .meta{display:flex;gap:12px;align-items:center}
    .btn{padding:8px 10px;border-radius:6px;background:var(--accent);color:#0b0b0b;cursor:pointer;border:none}
    #chart{height:calc(100% - 64px);border-radius:6px;overflow:hidden}
    .rightpanel{width:320px;background:var(--panel);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px}
    .muted{color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="search">
        <input id="searchInput" placeholder="Buscar símbolo o mercado (ej. BTC, ETH, Forex...)" />
        <button id="reloadBtn" class="btn">Refrescar</button>
      </div>

      <div class="market-tabs" id="marketTabs"></div>

      <div style="font-size:13px;color:var(--muted)">Símbolos</div>
      <div class="symbols" id="symbolsList"></div>
    </aside>

    <main class="main">
      <div class="chart-wrap">
        <div class="chart-header">
          <div class="meta">
            <div id="selectedSymbol" style="font-size:18px;font-weight:700">Selecciona un símbolo</div>
            <div id="selectedLabel" class="muted"></div>
            <div id="priceBadge" style="margin-left:12px"></div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <select id="intervalSelect" title="Intervalo">
              <option value="1">1s</option>
              <option value="5">5s</option>
              <option value="60">1m</option>
              <option value="300">5m</option>
              <option value="900">15m</option>
              <option value="3600">1h</option>
              <option value="86400">1d</option>
            </select>
            <button id="tvWidgetBtn" class="btn">Abrir TradingView</button>
          </div>
        </div>

        <div id="chart"></div>
      </div>

      <div style="display:flex;gap:12px">
        <div style="flex:1;background:var(--panel);padding:12px;border-radius:8px">
          <div style="font-weight:700;margin-bottom:8px">Orden rápida</div>
          <div class="muted">Qty</div>
          <input id="qty" type="number" value="1" style="width:100%;padding:8px;border-radius:6px;background:transparent;border:1px solid rgba(255,255,255,0.04);color:inherit" />
          <div style="display:flex;gap:8px;margin-top:8px">
            <button id="buyBtn" class="btn" style="flex:1">Buy</button>
            <button id="sellBtn" class="btn" style="flex:1">Sell</button>
          </div>
        </div>

        <aside class="rightpanel">
          <div style="font-weight:700">Resumen</div>
          <div id="positionsSummary" class="muted">Sin posiciones</div>
          <div style="font-weight:700;margin-top:8px">Info</div>
          <div id="debug" class="muted"></div>
        </aside>
      </div>
    </main>

    <aside class="rightpanel" style="min-width:320px">
      <div style="font-weight:700">Conexión</div>
      <div id="socketStatus" class="muted">Conectando...</div>
      <div style="font-weight:700;margin-top:8px">Cuenta</div>
      <div id="acctInfo" class="muted">-</div>
      <div style="font-weight:700;margin-top:8px">Notas</div>
      <div class="muted">Inicia sesión para ver tu cuenta/posiciones reales.</div>
    </aside>
  </div>

  <!-- dependencias -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

  <script>
    (function(){
      // refs
      const symbolsListEl = document.getElementById('symbolsList');
      const marketTabsEl = document.getElementById('marketTabs');
      const searchInput = document.getElementById('searchInput');
      const reloadBtn = document.getElementById('reloadBtn');
      const selectedSymbolEl = document.getElementById('selectedSymbol');
      const selectedLabelEl = document.getElementById('selectedLabel');
      const priceBadge = document.getElementById('priceBadge');
      const socketStatus = document.getElementById('socketStatus');
      const debug = document.getElementById('debug');
      const tvWidgetBtn = document.getElementById('tvWidgetBtn');
      const intervalSelect = document.getElementById('intervalSelect');

      let allSymbols = []; // array of {symbol,label,market}
      let currentMarket = null;
      let filteredSymbols = [];
      let selectedSymbol = null;
      let chart, series;

      // init socket (uses same origin /socket.io/)
      const socket = io({ path: '/socket.io' });

      socket.on('connect', () => {
        socketStatus.textContent = 'Socket conectado (' + socket.id + ')';
        socketStatus.style.color = '#7ed957';
        // request initial snapshot
        try { socket.emit('request_prices_snapshot'); } catch(e){}
        try { socket.emit('request_symbols'); } catch(e){}
      });
      socket.on('disconnect', () => {
        socketStatus.textContent = 'Socket desconectado';
        socketStatus.style.color = '#ff6b6b';
      });

      // handle server price snapshot (object of symbol->price data)
      socket.on('prices_snapshot', (prices) => {
        debug.textContent = 'snapshot ' + Object.keys(prices || {}).length + ' symbols';
        // set initial prices badges in list if present
        for(const key of Object.keys(prices || {})){
          // we'll update when listed
          updateSymbolPriceInList(key, prices[key]);
        }
      });

      // symbols_update: list of symbols from server
      socket.on('symbols_update', (arr) => {
        if(Array.isArray(arr) && arr.length){
          // normalize to {symbol,label,market}
          allSymbols = arr.map(s => {
            if(typeof s === 'string') return { symbol: s, label: s, market: 'Unknown' };
            return { symbol: s.symbol || s.ticker || s, label: s.label || s.symbol || s.ticker || s, market: s.market || 'Unknown' };
          });
          renderMarketsAndList();
        }
      });

      // fallback: fetch lists from REST if socket doesn't provide
      async function fetchSymbolsFromApi(){
        try {
          const res = await fetch('/api/market/list');
          const list = await res.json();
          if(Array.isArray(list)) allSymbols = list.map(s => ({ symbol: s.symbol, label: s.label, market: s.market }));
          else if(list && list.markets) { /* ignore */ }
        } catch(e){
          console.warn('no se pudo cargar /api/market/list', e);
        }

        try {
          const res2 = await fetch('/api/symbols');
          const s2 = await res2.json();
          if(Array.isArray(s2)) {
            // merge, avoid duplicates
            const map = new Map();
            allSymbols.forEach(s => s && map.set(s.symbol, s));
            s2.forEach(s => {
              const k = s.symbol || s.ticker;
              if(!map.has(k)) map.set(k, { symbol: k, label: s.label || k, market: s.market || 'Unknown' });
            });
            allSymbols = Array.from(map.values());
          }
        } catch(e){}
        renderMarketsAndList();
      }

      function renderMarketsAndList(){
        // build markets
        const markets = Array.from(new Set(allSymbols.map(s => s.market || 'Unknown')));
        marketTabsEl.innerHTML = '';
        markets.forEach(m=>{
          const el = document.createElement('div');
          el.className = 'market-tab' + ((!currentMarket && m==='Crypto') || (currentMarket===m) ? ' active' : '');
          el.textContent = m;
          el.addEventListener('click', () => { currentMarket = m; renderSymbols(); markActiveTab(m); });
          marketTabsEl.appendChild(el);
        });

        if(!currentMarket) currentMarket = markets[0] || null;
        renderSymbols();
      }

      function markActiveTab(m){
        Array.from(marketTabsEl.children).forEach(ch => ch.classList.toggle('active', ch.textContent === m));
      }

      function renderSymbols(){
        const q = (searchInput.value||'').trim().toLowerCase();
        filteredSymbols = allSymbols.filter(s => (s.market||'').toLowerCase().includes((currentMarket||'').toLowerCase()) && (!q || s.symbol.toLowerCase().includes(q) || (s.label||'').toLowerCase().includes(q)));
        // sort by symbol
        filteredSymbols.sort((a,b)=> (a.symbol>b.symbol?1:-1));
        symbolsListEl.innerHTML = '';
        filteredSymbols.slice(0, 200).forEach(s=>{
          const row = document.createElement('div');
          row.className = 'symbol-row';
          row.innerHTML = `<div class="symbol-left"><div style="width:8px"></div><div>
            <div class="symbol-name">${s.symbol}</div>
            <div class="symbol-label">${s.label}</div>
          </div></div>
          <div style="text-align:right">
            <div class="symbol-price" id="price-${escapeId(s.symbol)}">-</div>
            <div class="muted" id="chg-${escapeId(s.symbol)}"></div>
          </div>`;
          row.addEventListener('click', () => selectSymbol(s));
          symbolsListEl.appendChild(row);
        });
      }

      function escapeId(id){ return id.replace(/[^a-z0-9_-]/gi,'_'); }

      function updateSymbolPriceInList(symbol, info){
        const el = document.getElementById('price-' + escapeId(symbol));
        const ch = document.getElementById('chg-' + escapeId(symbol));
        if(el){
          const price = (info && (info.price || info.last || info.p)) || null;
          el.textContent = price !== null ? (Number(price).toFixed(6).replace(/\.?0+$/,'') ) : '-';
          if(ch){
            let c = '';
            if(info && info.change != null) c = (info.change>0? '+' : '') + (Number(info.change).toFixed(2)) + '%';
            ch.textContent = c;
          }
        }
      }

      async function selectSymbol(s){
        if(!s) return;
        selectedSymbol = s;
        selectedSymbolEl.textContent = s.symbol;
        selectedLabelEl.textContent = s.label ? ' · ' + s.label : '';
        // reset chart + series
        if(!chart){
          initChart();
        } else {
          // clear series points by removing and readding
          chart.removeSeries(series);
          series = chart.addLineSeries({ color: '#4ade80' });
        }
        // send subscribe to socket
        try { socket.emit('subscribe', { symbol: s.symbol }); } catch(e){ console.warn('subscribe err', e); }
        // fetch initial price (if REST available)
        try {
          const r = await fetch('/api/symbols');
          const data = await r.json();
          if(Array.isArray(data)){
            const found = data.find(x => (x.symbol||x.ticker) === s.symbol);
            if(found && found.price) {
              const t = Math.floor(Date.now()/1000);
              series.setData([{ time: t, value: found.price }]);
              priceBadge.textContent = found.price;
            }
          }
        } catch(e){}
      }

      function initChart(){
        const container = document.getElementById('chart');
        container.innerHTML = '';
        chart = LightweightCharts.createChart(container, {
          layout: { background: { color: '#071019' }, textColor: '#dbeafe' },
          timeScale: { rightOffset: 5, barSpacing: 12 },
          grid: { vertLines: { color: 'rgba(255,255,255,0.02)' }, horzLines: { color: 'rgba(255,255,255,0.02)' } }
        });
        series = chart.addLineSeries({ color: '#4ade80' });
        chart.timeScale().fitContent();
      }

      // receive live updates (this maps to whatever your priceHandler emits)
      socket.on('price_update', (payload) => {
        // expected payload: { symbol, price, time, change }
        if(!payload || !payload.symbol) return;
        if(selectedSymbol && payload.symbol === selectedSymbol.symbol){
          const t = payload.time ? Math.floor(payload.time/1000) : Math.floor(Date.now()/1000);
          const v = Number(payload.price);
          if(Number.isFinite(v)){
            try { series.update({ time: t, value: v }); } catch(e){}
            priceBadge.textContent = v;
          }
        }
        // update list too
        updateSymbolPriceInList(payload.symbol, payload);
      });

      // fallback - server might emit generic updates in other keys
      socket.on('symbols_update', (arr) => {
        // handled above
      });

      // search handler
      searchInput.addEventListener('input', () => renderSymbols());
      reloadBtn.addEventListener('click', () => fetchSymbolsFromApi());
      tvWidgetBtn.addEventListener('click', () => {
        // Quick open TradingView chart in a new tab for advanced features
        if(!selectedSymbol) return alert('Selecciona un símbolo primero');
        const s = selectedSymbol.symbol.replace(':','/');
        const tvUrl = `https://www.tradingview.com/chart/?symbol=${encodeURIComponent(s)}`;
        window.open(tvUrl, '_blank');
      });

      // quick buy/sell (demo: emits a socket event, your backend must secure these)
      document.getElementById('buyBtn').addEventListener('click', () => {
        if(!selectedSymbol) return alert('Selecciona símbolo');
        const qty = Number(document.getElementById('qty').value) || 0;
        socket.emit('trade', { action: 'buy', symbol: selectedSymbol.symbol, qty });
        alert('Orden buy enviada (demo)');
      });
      document.getElementById('sellBtn').addEventListener('click', () => {
        if(!selectedSymbol) return alert('Selecciona símbolo');
        const qty = Number(document.getElementById('qty').value) || 0;
        socket.emit('trade', { action: 'sell', symbol: selectedSymbol.symbol, qty });
        alert('Orden sell enviada (demo)');
      });

      // init
      fetchSymbolsFromApi();

      // small compatibility: also try rest endpoints and socket fallback
      setTimeout(()=>{ try{ socket.emit('request_symbols'); }catch(e){} }, 800);

      // expose for debug
      window._LEONES_DASH = { socket, selectSymbol, allSymbols };

    })();
  </script>
</body>
</html>
