<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restablecer Contraseña</title>

<style>

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b0b0b;
  font-family:Arial;
  color:white;
}

.reset-box{
  width:100%;
  max-width:420px;
  background:#151515;
  padding:35px;
  border-radius:20px;
  border:1px solid rgba(207,162,64,.3);
}

h1{
  color:#cfa240;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border-radius:10px;
  border:none;
  background:#0f0f0f;
  color:white;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#cfa240;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

#message{
  margin-top:15px;
  text-align:center;
}

.success{
  color:#4bff88;
}

.error{
  color:#ff6b6b;
}

</style>
</head>
<body>

<div class="reset-box">

  <h1>Nueva Contraseña</h1>

  <form id="resetForm">

    <input
      type="password"
      id="password"
      placeholder="Nueva contraseña"
      required
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirmar contraseña"
      required
    >

    <button type="submit">
      Guardar contraseña
    </button>

    <div id="message"></div>

  </form>

</div>

<script>

const form = document.getElementById("resetForm");

const params = new URLSearchParams(window.location.search);

const token = params.get("token");

form.addEventListener("submit", async (e)=>{

  e.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  const message = document.getElementById("message");

  if(password !== confirmPassword){

    message.innerHTML = `
      <span class="error">
        Las contraseñas no coinciden
      </span>
    `;

    return;
  }

  try{

    const response = await fetch("/api/password/reset-password",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        token,
        password
      })
    });

    const data = await response.json();

    if(response.ok){

      message.innerHTML = `
        <span class="success">
          Contraseña actualizada correctamente
        </span>
      `;

      setTimeout(()=>{
        window.location.href = "/";
      },2000);

    }else{

      message.innerHTML = `
        <span class="error">
          ${data.message || "Error"}
        </span>
      `;
    }

  }catch(err){

    message.innerHTML = `
      <span class="error">
        Error del servidor
      </span>
    `;
  }

});

</script>

</body>
</html>
