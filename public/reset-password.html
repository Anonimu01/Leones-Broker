<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restablecer Contraseña</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b0b0b;
  font-family:Arial;
  color:white;
  padding:20px;
}

.reset-box{
  width:100%;
  max-width:420px;
  background:#151515;
  padding:35px;
  border-radius:20px;
  border:1px solid rgba(207,162,64,.3);
  box-shadow:
    0 0 25px rgba(207,162,64,.08),
    0 20px 50px rgba(0,0,0,.6);
}

h1{
  color:#cfa240;
  margin-bottom:20px;
  text-align:center;
}

.password-group{
  position:relative;
  width:100%;
  margin-bottom:15px;
}

.password-group input{
  width:100%;
  padding:14px;
  padding-right:50px;
  border-radius:10px;
  border:none;
  background:#0f0f0f;
  color:white;
  outline:none;
  font-size:15px;
}

.password-group input:focus{
  border:1px solid #cfa240;
  box-shadow:0 0 12px rgba(207,162,64,.25);
}

.toggle-password{
  position:absolute;
  top:50%;
  right:15px;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:18px;
  user-select:none;
  color:#cfa240;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#cfa240;
  color:#111;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
  font-size:15px;
}

button:hover{
  opacity:.9;
  transform:translateY(-1px);
}

#message{
  margin-top:15px;
  text-align:center;
  font-size:14px;
}

.success{
  color:#4bff88;
}

.error{
  color:#ff6b6b;
}

.loading{
  color:#cfa240;
}

</style>

</head>
<body>

<div class="reset-box">

  <h1>Nueva Contraseña</h1>

  <form id="resetForm">

    <!-- PASSWORD -->

    <div class="password-group">

      <input
        type="password"
        id="password"
        placeholder="Nueva contraseña"
        required
      >

      <span
        class="toggle-password"
        data-target="password"
      >
        👁
      </span>

    </div>

    <!-- CONFIRM PASSWORD -->

    <div class="password-group">

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirmar contraseña"
        required
      >

      <span
        class="toggle-password"
        data-target="confirmPassword"
      >
        👁
      </span>

    </div>

    <button type="submit">
      Guardar contraseña
    </button>

    <div id="message"></div>

  </form>

</div>

<script>

/* =========================================
   TOGGLE PASSWORD
========================================= */

const toggles =
  document.querySelectorAll(".toggle-password");

toggles.forEach((toggle)=>{

  toggle.addEventListener("click", ()=>{

    const targetId =
      toggle.getAttribute("data-target");

    const input =
      document.getElementById(targetId);

    if(input.type === "password"){

      input.type = "text";

      toggle.textContent = "🙈";

    }else{

      input.type = "password";

      toggle.textContent = "👁";

    }

  });

});

/* =========================================
   RESET PASSWORD
========================================= */

const form =
  document.getElementById("resetForm");

const params =
  new URLSearchParams(window.location.search);

const token =
  params.get("token");

form.addEventListener("submit", async (e)=>{

  e.preventDefault();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const message =
    document.getElementById("message");

  /* VALIDAR TOKEN */

  if(!token){

    message.innerHTML = `
      <span class="error">
        Token inválido
      </span>
    `;

    return;
  }

  /* VALIDAR PASSWORD */

  if(password.length < 6){

    message.innerHTML = `
      <span class="error">
        La contraseña debe tener mínimo 6 caracteres
      </span>
    `;

    return;
  }

  /* VALIDAR MATCH */

  if(password !== confirmPassword){

    message.innerHTML = `
      <span class="error">
        Las contraseñas no coinciden
      </span>
    `;

    return;
  }

  /* LOADING */

  message.innerHTML = `
    <span class="loading">
      Actualizando contraseña...
    </span>
  `;

  try{

    const response =
      await fetch("/api/password/reset-password",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          token,
          password
        })

      });

    const data =
      await response.json();

    /* SUCCESS */

    if(response.ok){

      message.innerHTML = `
        <span class="success">
          ✓ Contraseña actualizada correctamente
        </span>
      `;

      form.reset();

      setTimeout(()=>{

        window.location.href = "/";

      },2500);

    }

    /* ERROR */

    else{

      message.innerHTML = `
        <span class="error">
          ${data.message || "Error"}
        </span>
      `;

    }

  }

  catch(err){

    console.error(err);

    message.innerHTML = `
      <span class="error">
        Error del servidor
      </span>
    `;

  }

});

</script>

</body>
</html>
